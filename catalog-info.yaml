# Backstage catalog for this repository. Shared entries (groups, systems) are identical in every ACME Shop repo.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: users
  title: Users
  description: Customer accounts and sign-up (Amazon Cognito); announces new customers to the rest of the estate.
  tags:
  - python
  - aws-lambda
  - cognito
  annotations:
    github.com/project-slug: kaku0/acme-shop-users
    stackrails.io/hosts: accounts.acme-shop.example
  links:
  - url: https://github.com/kaku0/acme-shop-users
    title: Source
spec:
  type: service
  lifecycle: production
  owner: group:identity-team
  system: customer-identity
  dependsOn:
  - component:platform
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: customer-identity
  description: Customer accounts and authentication.
spec:
  owner: group:identity-team
  domain: commerce
  type: product
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: acme-group
  description: 'ACME Retail Group: online and in-store retail.'
spec:
  type: root
  profile:
    displayName: ACME Retail Group
    email: acme-group@acme-shop.example
  children:
  - digital-commerce
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: digital-commerce
  description: Everything behind the ACME online shop.
spec:
  type: business-unit
  profile:
    displayName: Digital Commerce
    email: digital-commerce@acme-shop.example
  parent: acme-group
  children:
  - customer-experience
  - order-fulfilment
  - finance-technology
  - platform-engineering
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: customer-experience
  description: Storefront, catalogue and customer accounts.
spec:
  type: department
  profile:
    displayName: Customer Experience
    email: customer-experience@acme-shop.example
  parent: digital-commerce
  children:
  - storefront-team
  - catalog-team
  - identity-team
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: identity-team
  description: Customer accounts, sign-up and sign-in.
spec:
  type: team
  profile:
    displayName: Identity Team
    email: identity-team@acme-shop.example
  parent: customer-experience
  children: []
